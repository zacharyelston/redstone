# Release.com specific Helm values override
# This file contains configurations specifically for ephemeral environments
# that prevent ClusterRole conflicts between multiple deployments

# Override global settings for Release.com ephemeral environments
global:
  # Use release name as prefix to avoid conflicts
  namePrefix: "{{ .Release.Name }}-"

# Loki Configuration - Release.com optimized
loki:
  enabled: true
  fullnameOverride: "{{ .Release.Name }}-loki"
  nameOverride: "{{ .Release.Name }}-loki"
  
  # Basic configuration for Release.com
  image:
    tag: "latest"
  
  # Completely disable ALL ClusterRole-creating components
  monitoring:
    enabled: false
  grafana-agent-operator:
    enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  rbac:
    create: false
  grafanaAgent:
    enabled: false
  agent:
    enabled: false
  
  # Disable any other potential ClusterRole creators
  grafana-agent:
    enabled: false
  promtail:
    enabled: false
  
  # Keep Loki as internal cluster service only
  service:
    type: ClusterIP
    port: 3100

# Grafana Configuration - Release.com optimized  
grafana:
  enabled: true
  fullnameOverride: "{{ .Release.Name }}-grafana"
  nameOverride: "{{ .Release.Name }}-grafana"
  
  # Basic configuration for Release.com
  adminPassword: "admin123"
  image:
    tag: "latest"
  
  # Environment variables for Grafana
  env:
    PROMETHEUS_URL: "http://{{ .Release.Name }}-prometheus-server:80"
    LOKI_URL: "http://{{ .Release.Name }}-loki:3100"
    GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
  
  # Completely disable RBAC to prevent ClusterRole creation
  rbac:
    create: false
    namespaced: false
  
  # Disable ALL sidecar components
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
    alerts:
      enabled: false
    notifiers:
      enabled: false
    plugins:
      enabled: false
  
  # Disable ALL agent-related components
  agent:
    enabled: false
  grafana-agent-operator:
    enabled: false
  grafanaOperator:
    enabled: false
  grafanaAgent:
    enabled: false
  
  # Disable service account creation if it causes issues
  serviceAccount:
    create: false
    name: default
  
  # Service exposure for Release.com
  service:
    type: ClusterIP
    port: 3000
    annotations:
      release.com/hostname: "grafana-${env_id}.${domain}"
  

# Prometheus Configuration - Release.com optimized
prometheus:
  enabled: true
  fullnameOverride: "{{ .Release.Name }}-prometheus"
  nameOverride: "{{ .Release.Name }}-prometheus"
  
  # Disable ALL ClusterRole-creating components
  kube-state-metrics:
    enabled: false
  rbac:
    create: false
  server:
    rbac:
      create: false
    clusterRole: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  
  # Disable alertmanager to reduce complexity
  alertmanager:
    enabled: false
  
  # Keep only essential components
  pushgateway:
    enabled: false
  nodeExporter:
    enabled: false
  
  # Keep Prometheus as internal cluster service only
  server:
    service:
      type: ClusterIP
      servicePort: 80

# Redmica Configuration - Release.com optimized
redmica:
  enabled: true
  service:
    type: ClusterIP
    port: 3000
    annotations:
      release.com/hostname: "redmica-${env_id}.${domain}"

# LDAP Configuration - Release.com optimized  
ldap:
  enabled: true
  service:
    type: ClusterIP
    port: 389
    annotations:
      release.com/hostname: "ldap-${env_id}.${domain}"

# Logging Configuration - Release.com optimized
logging:
  fluentBit:
    enabled: true
    # Disable RBAC completely
    rbac:
      create: false
    serviceAccount:
      create: false
      name: default
