# Release.com Environment-Specific Configurations
# This file defines which values files to use for different environments

environments:
  # Development environments (ephemeral branches, dev, feature branches)
  development:
    patterns:
      - "dev"
      - "feature/*"
      - "hotfix/*" 
      - "bugfix/*"
    values_files:
      - "values.yaml"
      - "values-development.yaml"
    description: "Uses 'latest' image tags for flexibility and testing"

  # Staging environment
  staging:
    patterns:
      - "staging"
      - "release/*"
    values_files:
      - "values.yaml"
      - "values-production.yaml"
    description: "Uses pinned versions for stability testing before production"

  # Production environment
  production:
    patterns:
      - "main"
      - "master"
      - "prod"
    values_files:
      - "values.yaml"
      - "values-production.yaml"
    description: "Uses pinned versions for maximum stability"

# Deployment commands by environment:
# 
# Development:
# helm upgrade --install redstone ./helm/redstone -f values.yaml -f values-development.yaml
#
# Production:
# helm upgrade --install redstone ./helm/redstone -f values.yaml -f values-production.yaml
