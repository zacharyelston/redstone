{{- if .Values.ldap.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redstone.fullname" . }}-ldap
  labels:
    {{- include "redstone.serviceLabels" (dict "serviceName" "ldap" "context" .) | nindent 4 }}
    app.kubernetes.io/component: ldap
spec:
  replicas: {{ .Values.ldap.replicaCount }}
  selector:
    matchLabels:
      {{- include "redstone.serviceSelectorLabels" (dict "serviceName" "ldap" "context" .) | nindent 6 }}
      app.kubernetes.io/component: ldap
  template:
    metadata:
      labels:
        {{- include "redstone.serviceSelectorLabels" (dict "serviceName" "ldap" "context" .) | nindent 8 }}
        app.kubernetes.io/component: ldap
        service: ldap
        component: authentication
    spec:
      initContainers:
        - name: init-ldap-data
          image: busybox:1.35
          command: ['sh', '-c', 'mkdir -p /data/db && chmod 777 /data/db']
          volumeMounts:
            - name: ldap-data
              mountPath: /data
      containers:
        - name: ldap
          image: "{{ .Values.ldap.image.repository }}:{{ .Values.ldap.image.tag }}"
          imagePullPolicy: {{ .Values.ldap.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 17170
              protocol: TCP
            - name: ldap
              containerPort: 3890
              protocol: TCP
          env:
            - name: LLDAP_LDAP_PORT
              value: "3890"
            - name: LLDAP_HTTP_PORT
              value: "17170"
            - name: LLDAP_LDAP_BASE_DN
              value: "dc=redstone,dc=local"
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "redstone.fullname" . }}-app-secrets
                  key: ldap-jwt-secret
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "redstone.fullname" . }}-app-secrets
                  key: ldap-admin-password
            - name: LLDAP_DATABASE_URL
              value: "sqlite:///data/db/lldap.db"
            - name: LLDAP_VERBOSE
              value: "true"
          resources:
            {{- toYaml .Values.ldap.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: ldap-data
              mountPath: /data
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: {{ include "redstone.fullname" . }}-ldap-data
{{- end }}
---
{{- if .Values.ldap.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redstone.fullname" . }}-ldap
  labels:
    {{- include "redstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: ldap
spec:
  type: {{ .Values.ldap.service.type }}
  ports:
    - port: 17170
      targetPort: 17170
      protocol: TCP
      name: http
    - port: 3890
      targetPort: 3890
      protocol: TCP
      name: ldap
  selector:
    {{- include "redstone.serviceSelectorLabels" (dict "serviceName" "ldap" "context" .) | nindent 4 }}
{{- end }}
---
{{- if .Values.ldap.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "redstone.fullname" . }}-ldap-data
  labels:
    {{- include "redstone.labels" . | nindent 4 }}
    app.kubernetes.io/component: ldap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
{{- end }}
