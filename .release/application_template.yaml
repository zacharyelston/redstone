---
execution_type: server
context: release-customer-us-west-2
domain: rls.sh
repo_name: zacharyelston/redstone
tracking_branch: main

# Custom hostnames for services - Release.com pattern
hostnames:
  grafana: grafana-red1-${branch_hash}-${env_id}.${domain}
  redmica: redmica-red1-${branch_hash}-${env_id}.${domain}
  ldap: ldap-red1-${branch_hash}-${env_id}.${domain}

environment_templates:
  - name: production
  - name: staging

resources:
  cpu:
    requests: 500m
    limits: 1000m
  memory:
    requests: 512Mi
    limits: 2Gi
  replicas: 1

charts:
  - directory: helm/redstone
    name: myapp
    values: values.yaml

workflows:
  - name: setup
    parallelize:
      - step: charts
        tasks:
          - charts.myapp
  - name: patch
    parallelize:
      - step: charts
        tasks:
          - charts.myapp
  - name: teardown
    parallelize:
      - step: remove-environment
        tasks:
          - release.remove_environment

