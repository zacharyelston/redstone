# Kubernetes Secret Management Example
# Use external-secrets-operator with your secret backend

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "redmica"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redmica-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: redmica-secrets
    creationPolicy: Owner
  data:
  - secretKey: database-password
    remoteRef:
      key: redmica/database
      property: password
  - secretKey: ldap-password
    remoteRef:
      key: redmica/ldap
      property: password
