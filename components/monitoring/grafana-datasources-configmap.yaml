apiVersion: v1
kind: ConfigMap
metadata:
  name: redstone-grafana-datasources
  namespace: redstone
  labels:
    app: grafana
    component: monitoring
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://redstone-prometheus-server:80
        isDefault: true
        version: 1
        editable: false
        uid: prometheus
        jsonData:
          timeInterval: "30s"

      - name: Loki
        type: loki
        access: proxy
        url: http://redstone-loki:3100
        version: 1
        editable: false
        uid: loki
        jsonData:
          maxLines: 1000
